<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Berry Browser">
  <defs>
    <radialGradient id="g" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ff7ad9"/>
      <stop offset="55%" stop-color="#d12cff"/>
      <stop offset="100%" stop-color="#6b1cff"/>
    </radialGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#1b0a2a" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- leaf -->
  <path d="M73 18c10-12 26-14 37-6-12 12-25 20-39 24" fill="#22c55e"/>
  <path d="M72 18c-3 11-1 19 6 25" fill="none" stroke="#16a34a" stroke-width="6" stroke-linecap="round"/>

  <!-- berry -->
  <circle cx="58" cy="72" r="42" fill="url(#g)" filter="url(#s)"/>
  <circle cx="44" cy="58" r="10" fill="#ffd6f5" opacity="0.55"/>
  <circle cx="74" cy="86" r="7" fill="#2b0b4a" opacity="0.18"/>

  <!-- subtle highlight -->
